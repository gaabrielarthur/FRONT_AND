<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>www.formulario.com</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Formulario HTML</h2>
    <form action="register.php" method="">

        <div>
            <label>Name:</label>
            <input type="text">
        </div>
        <div>
            <label for="age">Idade</label>
            <input type="age" name="age">
        </div>
        <!--SELECT-->
        <div>
            <label for="job">Selecione a sua profissão</label>
            <select name="job">
                <option value="Programador">Programador</option>
                <option value="analista">Analista</option>
                <option value="DevOps">DevOps</option>
            </select>
        </div>
        <div>
            <label for="contract">Você leu os termos do contrato</label>
            <select name="contract">
                <option value="Sim">Sim</option>
                <option value="Nãm">Nãm</option>
            </select>
        </div>
        <div>
            <label for="items">Selecione os intens desejados:</label>
            <select name="items">
                <option value="Pera">Pera</option>
                <option value="Laranja">Laranja</option>
                <option value="Goiaba">Goiaba</option>
                <option value="Uva">Uva</option>
            </select>
        </div>
        <div>
            <label for="comment">Escreva abaixo oque você achou do post:</label>
            <textarea name="comment"></textarea>
        </div>
        <!--Fieldset-->
        <fieldset>
            <legend>PRENCHA SUAS INFORMAÇÕES</legend> <!--Titulo para as label agrupa tudo-->
            <label for="firstname">firstname</label>
            <input type="text" name="firstname">
            <label for="lastname">lastname</label>
            <input type="text" name="lastname">
        </fieldset>


        <!--Dataist-->
        <div>
            <label for="flavor">Escolha o sabor: </label>
            <input type="text" list="flavor">

            <datalist id="flavors">
                <option value="Cereja"></option>
                <option value="Uva"></option>
                <option value="Morango"></option>
                <option value="Goiaba"></option>
            </datalist>
        </div>

        <!--senha-->
        <div>
            <label for="password">Digite sua senha:</label>
            <input type="password" name="password">
        </div>
        <!--radio button-->
        <div>
            <label for="car_model">Escolha um modelo do seu carro:</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="bmw">BMW</label>
            </div>
            <label for="car_model">Escolha um modelo do seu carro:</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="ferrari">ferrari</label>
            </div>
            <label for="car_model">Escolha um modelo do seu carro:</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="renault">renault</label>
            </div>
        </div>
        <!--checkbox pulei isso -->

        <!--input date-->
        <div>
            <label for="birthday"> Data de nascimento</label>
            <input type="date" name="data">
        </div>
        <!--input de arquivos-->
        <div>
            <label for="image">insira sua imagem</label>
            <input type="file" name="image">
        </div>
        <!--19 emails-->
        <div>
            <label for="emails">Digite seu email:</label>
            <input type="email" name="email">
        </div>
        <!--20 - value -->
        <div>
            <label for="value">Digite algum valor:</label>
            <input type="text" value="meu valor é este 10" name="value">
        </div>
        <!--disabled-->
        <div>
            <p>tente mudar o valor</p>
            <input type="text" value="não precisa preencher" disabled>
        </div>

        <!--placeholder-->
        <div>
            <label for="current job">Digite sua profissão atual:</label>
            <input type="text" name="currentjob" placeholder="No que voçê trabalha agora">
        </div>
        <!--resetar o fomrulario-->
        <input type="reset" value="Limpar">

        <!--Enviar o formulario-->
        <input type="submit" value="Cadastrar">
    </form>


</body>

</html>
